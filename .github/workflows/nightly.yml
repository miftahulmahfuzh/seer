name: Nightly

on:
  schedule:
    # Massive's plan refuses the grouped aggregate for a date that is still *today* in Eastern
    # time ("Attempted to request today's data before end of day", HTTP 403). The NYSE close is
    # not the gate the data is: session D only becomes fetchable at ET midnight, i.e. 04:00 UTC
    # in EDT and 05:00 UTC in EST. So the night's run happens on the morning *after* the session
    # it reads, not the evening of it, and every slot sits after 05:00 UTC to hold in both
    # offsets. The far edge is the next US open (13:30 UTC EDT / 14:30 UTC EST): picks for
    # session D+1 must exist before it. Minutes are off the hour on purpose — GitHub's scheduler
    # runs hours late on :00 and :30.
    #
    # 06:17 UTC Tue-Sat = 13:17 WIB, reading Mon-Fri's session.
    - cron: '17 6 * * 2-6'
    # Retry slots, 09:41 and 12:41 UTC (16:41 and 19:41 WIB). Each is a no-op once the session
    # has succeeded; the last lands before the US open in both EDT and EST.
    - cron: '41 9 * * 2-6'
    - cron: '41 12 * * 2-6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and compute everything, then roll back (writes nothing)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seer-db-writer
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    # 45, not 30: nightly makes 3 Massive calls per missing session (bars, splits, dividends) at
    # 12.5 s spacing (about 40 s a session), then Veto (about 1 min, never more than its own
    # 10-minute limit), Paper, Paper check and Explain run in the same job.
    timeout-minutes: 45
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      PYTHONUNBUFFERED: '1'
      # Paper trading switch. Paused 2026-10-07 until paper could run split-cadence rules and RM was
      # replaced by RMW; resumed the same day so every roster strategy starts on the same night.
      # 'true' skips Veto, Paper, Paper check and Explain; Migrate and Nightly (bars) always run.
      PAPER_PAUSED: 'false'
    steps:
      - name: Check secrets
        run: |
          missing=0
          for name in DATABASE_URL_UNPOOLED MASSIVE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. See docs/runbooks/data-pipeline.md (Owner steps)."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine
        run: python -m pip install -e engine

      - name: Migrate
        run: |
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          python -m seer_engine "${flags[@]}" migrate

      - name: Nightly
        run: |
          flags=(-v)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          python -m seer_engine "${flags[@]}" nightly

      # Strategy C's news check (handover D6): A's first 10 candidates for the next session,
      # Finnhub headlines and earnings dates, one LLM verdict each, stored in news_vetoes before
      # Paper reads them. Never fails the night: missing secrets, a Finnhub or LLM outage, an
      # LLM_MODEL other than C's frozen one, a crash or the 10-minute limit only make C sit the
      # session out (a failed or missing verdict is no trade, design §8); the other four
      # strategies never read it. Nominally about 1 minute. A re-run for a session already
      # checked makes no calls. See docs/runbooks/paper-trading.md (Strategy C: the news check).
      - name: Veto
        if: ${{ env.PAPER_PAUSED != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          flags=(-v)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          python -m seer_engine "${flags[@]}" veto

      - name: Paper
        if: ${{ env.PAPER_PAUSED != 'true' }}
        run: |
          flags=(-v)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          python -m seer_engine "${flags[@]}" paper

      # Replay check (D7): the stored paper state must equal a one-shot run_rules / buy_and_hold
      # replay. Read-only. A mismatch turns the run red (GitHub emails); paper state is already
      # committed and the next night still runs. See docs/runbooks/paper-trading.md.
      - name: Paper check
        if: ${{ env.PAPER_PAUSED != 'true' }}
        id: paper_check
        run: |
          flags=(-v)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          python -m seer_engine "${flags[@]}" paper_check

      # Optional LLM explanations (D9). Never fails the night: missing secrets or any LLM error
      # leave the text NULL ("unavailable" in the app). Runs after a red Paper check too, but
      # not after a failed Nightly or Paper.
      - name: Explain
        if: ${{ env.PAPER_PAUSED != 'true' && (success() || steps.paper_check.outcome == 'failure') }}
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          flags=(-v)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          python -m seer_engine "${flags[@]}" explain

      # Sean (the owner's real Gotrade trades): fetch closes for every symbol the owner has held
      # and rewrite the daily profit/loss series. Independent of paper trading, so it runs while
      # paper is paused too. Never fails the night: a Yahoo outage or a crash only leaves Sean's
      # graph a day behind. Runs after a red Paper check, like Explain.
      - name: Sean marks
        if: ${{ success() || steps.paper_check.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          flags=(-v)
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          python -m seer_engine "${flags[@]}" sean marks
