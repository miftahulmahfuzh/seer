name: CI

on:
  push:
    paths:
      - 'engine/**'
      - 'db/**'
      - 'web/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'engine/**'
      - 'db/**'
      - 'web/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: engine (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d seer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/seer_test
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine
        run: python -m pip install -e 'engine[dev]'

      - name: Lint engine
        # Rules live in engine/pyproject.toml [tool.ruff.lint]: bugs only (E9, F minus F401).
        run: python -m ruff check engine

      - name: Test engine (DB tests must run, not skip)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest engine/tests -q -rs | tee pytest.out
          if grep -q '^SKIPPED' pytest.out; then
            echo "::error::engine tests were skipped; PG_TEST_URL did not reach pytest"
            exit 1
          fi

  web:
    name: web (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web
        run: npm ci --no-audit --no-fund

      - name: Typecheck web
        run: npx tsc --noEmit

      - name: Test web
        run: npx vitest run
